[project]
name = "e-commerce"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adapters>=1.3.0",
    "asyncpg",
    "fastapi[standard]>=0.162.0",
    "fastmcp>=4.1.4",
    "langchain-anthropic>=1.7.7",
    "langchain-huggingface>=1.2.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-xai>=1.3.0",
    "langchain[mcp,openai]>=1.4.7",
    "langgraph>=1.2.19",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "sqlalchemy[asyncio]",
    "streamlit>=1.66.1",
]

[project.scripts]
e-commerce = "e_commerce:main"
e-commerce-mcp = "e_commerce.mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
